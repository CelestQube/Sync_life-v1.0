group 'com.xraph.plugin.flutter_unity_widget'
version '4.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()

        // DO NOT MODIFY
        // BUILD_ADD_UNITY_LIBS

        // FOR DEV ONLY
        flatDir {
            dirs "libs"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.xraph.plugin.flutter_unity_widget"
    compileSdk = 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk = 19
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlin {
        jvmToolchain(17)
    }
    
    packagingOptions {
        pickFirsts += ['**/unity-classes.jar']
    }
}

def lifecycle_version = '2.7.0'
def annotation_version = '1.7.1'

dependencies {
    implementation project(':unityLibrary')
    compileOnly files('libs/unity-classes.jar')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.annotation:annotation:$annotation_version"

    compileOnly rootProject.findProject(":flutter_plugin_android_lifecycle")

    // FOR DEV ONLY
//    implementation(name: 'flutter', ext:'jar')
}
