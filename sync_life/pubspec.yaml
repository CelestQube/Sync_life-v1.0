name: sync_life
description: Sync-Life motion capture, activity tracking and personal assistant.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  fl_chart: ^0.66.0 #新加
  http: ^1.2.1
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  # flutter_blue_plus: ^2.2.1
  permission_handler: ^11.0.0
  # 使用3D模型渲染库
  vector_math: ^2.1.4
  # URL启动器，用于打开外部应用
  url_launcher: ^6.2.0
  # 定位功能
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  flutter_unity_widget:
    path: ../plugins/flutter_unity_widget


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
